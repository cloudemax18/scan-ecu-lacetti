name: Reconstruct Delphi parameter table

on:
  push:
    paths:
      - "archivos/CheviExplorer1.8.exe"
      - "tools/reconstruct_delphi_table.py"
      - ".github/workflows/delphi-table-analysis.yml"

permissions:
  contents: write

jobs:
  extract-static-table:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Extract and validate descriptors
        run: |
          python tools/reconstruct_delphi_table.py >> "$GITHUB_STEP_SUMMARY"
          python tools/reconstruct_delphi_table.py --json > archivos/cloude/delphi_parameter_table.json
          python - <<'PY'
          import json
          p = json.load(open("archivos/cloude/delphi_parameter_table.json", encoding="utf-8"))
          assert p["entry_count"] == 376
          assert p["entry_size"] == 36
          assert len(p["rows"]) == 376
          assert any(r["selector"] == 0x12 for r in p["rows"])
          print("Validated table dimensions and MR-140 selector.")
          PY
      - name: Commit reconstructed table
        run: |
          if [ -z "$(git status --porcelain -- archivos/cloude/delphi_parameter_table.json)" ]; then
            echo "Extracted table is unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add archivos/cloude/delphi_parameter_table.json
          git commit -m "Extract Delphi static parameter table"
          git push
